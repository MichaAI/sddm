[General]
# Обои на фоне: путь абсолютный или от папки темы; пусто — градиент темы.
# Файл должен читаться пользователем sddm (домашние папки обычно нет)
background=
# Радиус размытия обоев, 0 — без размытия
blur=48
# Затемнение под плитки, 0…1
dim=0.45

# 3D-модель вместо аватарки (.glb/.gltf/.fbx/.obj), путь как у обоев.
# Нужен QtQuick3D у грейтера; без него — обычная иконка пользователя
avatarModel=
# В этот размер вписывается модель
modelSize=190
# Полный оборот модели, мс
spinMs=14000

# Язык даты под часами
locale=ru_RU

# Сетка: зазор, ширина колонки (аватар — квадрат этой ширины),
# высота часов и плитки сессии
gap=12
column=340
clockHeight=200
sessionHeight=100
