[General]
# Обои на фоне: путь абсолютный или от папки темы; пусто — градиент темы.
# Файл должен читаться пользователем sddm (домашние папки обычно нет)
background=
# Радиус размытия обоев, 0 — без размытия
blur=48
# Затемнение под плитки, 0…1
dim=0.45

# 3D-модель вместо аватарки, путь как у обоев. Нужен QtQuick3D у грейтера;
# без него — обычная иконка пользователя.
#   .glb/.gltf/.fbx/.obj — модель как есть, без анимаций;
#   .qml — сцена из tools/convert-avatar.sh, с анимациями
#          (нужен ещё QtQuick.Timeline)
avatarModel=
# Анимация из сцены (скрипт конвертации печатает их список); пусто — стоять
avatarAnimation=
# Скорость анимации: 1 — как в модели, 0.5 — вдвое медленнее
animationSpeed=1
# В этот размер вписывается модель
modelSize=190
# Полный оборот модели, мс; 0 — не крутить
spinMs=14000

# Язык даты под часами
locale=ru_RU

# Сетка: зазор, ширина колонки (аватар — квадрат этой ширины),
# высота часов и плитки сессии
gap=12
column=340
clockHeight=200
sessionHeight=100
